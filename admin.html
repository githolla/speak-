<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signups — ChatGPT Speak</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e8e3da' stroke-width='5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="admin-wrap">
  <a class="nav-brand" href="index.html" style="color:var(--ink)">ChatGPT <em>Speak</em></a>
  <div class="kicker" style="margin-top:34px">Admin</div>
  <h2>Newsletter signups.</h2>

  <form class="news-form" id="loginForm" style="margin-top:28px">
    <input type="password" id="password" placeholder="Admin password" required aria-label="Admin password" autocomplete="current-password">
    <button type="submit">View signups</button>
  </form>
  <div class="news-msg" id="loginMsg" aria-live="polite"></div>

  <div id="results" hidden>
    <div class="admin-meta">
      <span id="countLabel"></span>
      <button type="button" class="admin-csv" id="csvBtn">Download CSV</button>
    </div>
    <table class="admin-table" id="signupTable">
      <thead><tr><th>Email</th><th>Signed up</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var msg = document.getElementById('loginMsg');
  var results = document.getElementById('results');
  var tbody = document.querySelector('#signupTable tbody');
  var countLabel = document.getElementById('countLabel');
  var csvBtn = document.getElementById('csvBtn');
  var rows = [];

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = 'Checking…';
    fetch('/api/signups', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          msg.textContent = res.d.error || 'Something went wrong.';
          results.hidden = true;
          return;
        }
        rows = res.d.signups || [];
        msg.textContent = '';
        countLabel.textContent = res.d.count + (res.d.count === 1 ? ' signup' : ' signups');
        tbody.innerHTML = '';
        rows.forEach(function (s) {
          var tr = document.createElement('tr');
          var td1 = document.createElement('td');
          td1.textContent = s.email;
          var td2 = document.createElement('td');
          td2.textContent = s.date ? new Date(s.date).toLocaleString() : '';
          tr.appendChild(td1);
          tr.appendChild(td2);
          tbody.appendChild(tr);
        });
        results.hidden = false;
      })
      .catch(function () { msg.textContent = 'Network error — try again.'; });
  });

  csvBtn.addEventListener('click', function () {
    var csv = 'email,signed_up\n' + rows.map(function (s) {
      return '"' + s.email.replace(/"/g, '""') + '","' + (s.date || '') + '"';
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'chatgptspeak-signups.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
