<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPTSpeak</title>
<meta name="description" content="ChatGPTSpeak — talk with AI in a familiar chat interface.">
<style>
  :root {
    --bg-main: #ffffff;
    --bg-sidebar: #f9f9f9;
    --bg-input: #f4f4f4;
    --bg-hover: #ececec;
    --bg-user-bubble: #e8e8e8;
    --text-main: #0d0d0d;
    --text-secondary: #5d5d5d;
    --border: #e3e3e3;
    --accent: #0d0d0d;
    --sidebar-width: 260px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "Söhne", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    overflow: hidden;
  }

  .app {
    display: flex;
    height: 100dvh;
    width: 100%;
  }

  /* ── Sidebar ─────────────────────────────── */
  .sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.25s ease;
    z-index: 20;
  }
  .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-width)); }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-main);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-hover); }
  .icon-btn svg { width: 20px; height: 20px; }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 12px 8px;
    padding: 10px 12px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-main);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
  }
  .new-chat-btn:hover { background: var(--bg-hover); }
  .new-chat-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .sidebar-section-label {
    padding: 16px 20px 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px;
  }
  .chat-list-item {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-main);
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-list-item:hover, .chat-list-item.active { background: var(--bg-hover); }

  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding: 12px;
  }
  .profile-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-radius: 10px;
    background: transparent;
    font-size: 14px;
    color: var(--text-main);
    cursor: pointer;
    text-align: left;
  }
  .profile-btn:hover { background: var(--bg-hover); }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #19c37d, #0fa47f);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* ── Main area ───────────────────────────── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    min-height: 56px;
  }
  .topbar .icon-btn.open-sidebar { display: none; }
  .sidebar.collapsed ~ .main .icon-btn.open-sidebar,
  .app.sidebar-hidden .icon-btn.open-sidebar { display: flex; }

  .brand {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-main);
  }
  .brand span { color: var(--text-secondary); font-weight: 400; }

  /* ── Chat area ───────────────────────────── */
  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    display: none;
    scroll-behavior: smooth;
  }
  .messages-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .msg { display: flex; width: 100%; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--bg-user-bubble);
    border-radius: 20px;
    padding: 10px 16px;
    max-width: 75%;
  }
  .msg.assistant .bubble {
    padding: 4px 0;
    max-width: 100%;
  }
  .bubble {
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .typing {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-main);
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* ── Welcome / centered state ────────────── */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0 16px;
  }
  .welcome h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 28px;
    text-align: center;
  }

  /* ── Input box ───────────────────────────── */
  .composer-wrap {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
  }
  .chat-container.chatting .composer-wrap {
    padding-bottom: 16px;
  }
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    width: 100%;
    background: var(--bg-input);
    border-radius: 26px;
    padding: 10px 10px 10px 20px;
    box-shadow: 0 0 0 1px var(--border);
  }
  .composer textarea {
    flex: 1;
    border: none;
    background: transparent;
    resize: none;
    outline: none;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text-main);
    max-height: 200px;
    padding: 6px 0;
  }
  .composer textarea::placeholder { color: var(--text-secondary); }

  .send-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .send-btn:disabled { opacity: 0.3; cursor: default; }
  .send-btn svg { width: 18px; height: 18px; }

  .disclaimer {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    padding: 8px 16px 4px;
  }

  /* ── Mobile ──────────────────────────────── */
  .backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 15;
  }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      margin-left: calc(-1 * var(--sidebar-width));
      box-shadow: 2px 0 12px rgba(0,0,0,0.1);
    }
    .sidebar.mobile-open { margin-left: 0; }
    .sidebar.mobile-open ~ .backdrop { display: block; }
    .topbar .icon-btn.open-sidebar { display: flex; }
    .welcome h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="sidebar-header">
      <button class="icon-btn" id="closeSidebarBtn" title="Close sidebar" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      New chat
    </button>

    <div class="sidebar-section-label">Chats</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">
      <button class="profile-btn">
        <span class="avatar">GS</span>
        <span>Guest</span>
      </button>
    </div>
  </nav>
  <div class="backdrop" id="backdrop"></div>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn open-sidebar" id="openSidebarBtn" title="Open sidebar" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="brand">ChatGPTSpeak <span>beta</span></div>
    </header>

    <div class="chat-container" id="chatContainer">
      <!-- Messages (hidden until first message) -->
      <div class="messages" id="messages">
        <div class="messages-inner" id="messagesInner"></div>
      </div>

      <!-- Welcome state: centered heading + centered chat box -->
      <div class="welcome" id="welcome">
        <h1>What can I help with?</h1>
        <div class="composer-wrap">
          <form class="composer" id="composerForm">
            <textarea id="composerInput" rows="1" placeholder="Ask anything" aria-label="Message ChatGPTSpeak"></textarea>
            <button class="send-btn" id="sendBtn" type="submit" disabled aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
              </svg>
            </button>
          </form>
        </div>
      </div>

      <div class="disclaimer">ChatGPTSpeak can make mistakes. Check important info.</div>
    </div>
  </main>
</div>

<script>
(function () {
  const app = document.getElementById('app');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');
  const openBtn = document.getElementById('openSidebarBtn');
  const closeBtn = document.getElementById('closeSidebarBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const chatList = document.getElementById('chatList');
  const chatContainer = document.getElementById('chatContainer');
  const welcome = document.getElementById('welcome');
  const messages = document.getElementById('messages');
  const messagesInner = document.getElementById('messagesInner');
  const form = document.getElementById('composerForm');
  const input = document.getElementById('composerInput');
  const sendBtn = document.getElementById('sendBtn');
  const composerWrap = form.parentElement;

  const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

  // ── Sidebar toggle ──
  function openSidebar() {
    if (isMobile()) sidebar.classList.add('mobile-open');
    else sidebar.classList.remove('collapsed');
    app.classList.remove('sidebar-hidden');
  }
  function closeSidebar() {
    if (isMobile()) sidebar.classList.remove('mobile-open');
    else sidebar.classList.add('collapsed');
    app.classList.add('sidebar-hidden');
  }
  openBtn.addEventListener('click', openSidebar);
  closeBtn.addEventListener('click', closeSidebar);
  backdrop.addEventListener('click', closeSidebar);

  // ── Chat state ──
  let chats = [];
  let currentChat = null;

  function newChat() {
    currentChat = { id: Date.now(), title: null, messages: [] };
    chats.unshift(currentChat);
    renderChatList();
    renderMessages();
    if (isMobile()) closeSidebar();
    input.focus();
  }

  function renderChatList() {
    chatList.innerHTML = '';
    chats.filter(c => c.messages.length).forEach(chat => {
      const btn = document.createElement('button');
      btn.className = 'chat-list-item' + (chat === currentChat ? ' active' : '');
      btn.textContent = chat.title || 'New chat';
      btn.addEventListener('click', () => {
        currentChat = chat;
        renderChatList();
        renderMessages();
        if (isMobile()) closeSidebar();
      });
      chatList.appendChild(btn);
    });
  }

  function renderMessages() {
    messagesInner.innerHTML = '';
    const hasMessages = currentChat && currentChat.messages.length > 0;
    if (hasMessages) {
      chatContainer.classList.add('chatting');
      welcome.style.display = 'none';
      messages.style.display = 'block';
      chatContainer.insertBefore(messages, chatContainer.firstChild);
      chatContainer.insertBefore(composerWrap, document.getElementById('chatContainer').querySelector('.disclaimer'));
      currentChat.messages.forEach(m => appendBubble(m.role, m.text));
      scrollToBottom();
    } else {
      chatContainer.classList.remove('chatting');
      messages.style.display = 'none';
      welcome.style.display = 'flex';
      welcome.appendChild(composerWrap);
    }
  }

  function appendBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesInner.appendChild(row);
    return bubble;
  }

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  // ── Composer ──
  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim().length === 0;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    if (!currentChat) newChat();
    if (!currentChat.title) {
      currentChat.title = text.length > 34 ? text.slice(0, 34) + '…' : text;
    }

    currentChat.messages.push({ role: 'user', text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    renderChatList();
    renderMessages();
    respond(currentChat);
  });

  // Placeholder assistant response until a backend is connected.
  function respond(chat) {
    const row = document.createElement('div');
    row.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const dot = document.createElement('span');
    dot.className = 'typing';
    bubble.appendChild(dot);
    row.appendChild(bubble);
    messagesInner.appendChild(row);
    scrollToBottom();

    const reply = "Thanks for trying ChatGPTSpeak! I'm just the interface for now — an AI backend will be connected soon. Stay tuned.";
    setTimeout(() => {
      bubble.textContent = '';
      let i = 0;
      const timer = setInterval(() => {
        bubble.textContent = reply.slice(0, ++i);
        scrollToBottom();
        if (i >= reply.length) {
          clearInterval(timer);
          chat.messages.push({ role: 'assistant', text: reply });
        }
      }, 18);
    }, 700);
  }

  newChatBtn.addEventListener('click', newChat);

  // Start with a fresh chat
  newChat();
})();
</script>
</body>
</html>
